  - packages/*

catalogs:
  default:
    "@astrojs/solid-js": 6.0.1
    "@astrojs/starlight": 0.38.2
    astro: 6.1.3
    jsdom: 29.0.1
    sharp: 0.34.5
    solid-js: 1.9.12
    "@types/node": 25.5.2
    "@iconify-json/ph": 1.2.2
    "@unocss/astro": 66.6.7
    "@unocss/core": 66.6.7
    "@unocss/preset-icons": 66.6.7
    typescript: 6.0.2
    unocss: 66.6.7
    vite: npm:@voidzero-dev/vite-plus-core@0.1.15
    vite-plus: 0.1.15
    vitest: npm:@voidzero-dev/vite-plus-test@0.1.15

onlyBuiltDependencies:
  - esbuild
overrides:
  vite: "catalog:"
