name: Publish to npm & JSR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @hotter-keys/core test

      - name: Build
        run: pnpm -r build

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish core to JSR
        run: npx jsr publish --allow-dirty
        working-directory: core

      - name: Publish solid to JSR
        run: npx jsr publish --allow-dirty
        working-directory: packages/solid

      - name: Publish devtools to JSR
        run: npx jsr publish --allow-dirty
        working-directory: packages/vite-plugin-devtools
