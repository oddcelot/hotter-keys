name: Publish to npm & JSR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp run --cache --filter @hotter-keys/core test
      - run: vp run --cache -r build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            packages/core/dist
            packages/solid/dist
            packages/vite-plugin-devtools/dist

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: .
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr-core:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vpx jsr publish --allow-dirty
        working-directory: packages/core

  # Note: @hotter-keys/solid and @hotter-keys/devtools are npm-only.
  # They depend on npm packages (solid-js, astro, vite) that JSR can't resolve.
