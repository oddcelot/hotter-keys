<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #1a1a2e;
        --bg-alt: #16213e;
        --border: #2a2a4a;
        --text: #e0e0e0;
        --text-muted: #888;
        --accent: #7c4dff;
        --green: #4caf50;
        --red: #f44336;
        --orange: #ff9800;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ── Tab bar (pinned) ── */

      .tab-bar {
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        flex-shrink: 0;
      }

      .tab-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        font-size: 12px;
        font-family: inherit;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        position: relative;
        opacity: 0.5;
        transition: opacity 0.15s;
      }

      .tab-btn:hover {
        opacity: 0.8;
      }

      .tab-btn.active {
        opacity: 1;
        color: var(--accent);
      }

      .tab-btn.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 8px;
        right: 8px;
        height: 2px;
        background: var(--accent);
        border-radius: 1px;
      }

      .tab-badge {
        font-size: 10px;
        background: var(--accent);
        color: #fff;
        padding: 0 5px;
        border-radius: 8px;
        line-height: 1.5;
      }

      /* ── Content (scrollable) ── */

      .tab-content {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }

      .tab-content[hidden] {
        display: none;
      }

      /* ── Layer stack ── */

      .layer-stack {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .layer-stack-label {
        font-size: 11px;
        color: var(--text-muted);
      }

      /* ── Badges ── */

      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 600;
      }

      .badge-success {
        background: rgba(76, 175, 80, 0.2);
        color: var(--green);
      }
      .badge-default {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-muted);
      }

      /* ── Layer groups ── */

      .layer-group {
        margin-bottom: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }

      .layer-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 12px;
        list-style: none;
      }

      .layer-header::-webkit-details-marker {
        display: none;
      }

      .layer-icon {
        font-size: 10px;
      }
      .layer-status {
        font-size: 10px;
        color: var(--text-muted);
      }
      .layer-count {
        margin-left: auto;
        font-size: 10px;
        color: var(--text-muted);
      }

      /* ── Data table ── */

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .data-table th {
        text-align: left;
        padding: 4px 12px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }

      .data-table td {
        padding: 4px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }

      .data-table code {
        font-family: inherit;
        color: var(--text);
      }

      /* ── Settings ── */

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
      }

      .setting-label {
        font-size: 12px;
      }

      .toggle-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        transition: all 0.15s;
      }

      .toggle-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── Empty state ── */

      .empty {
        padding: 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Tab bar — pinned at top -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="bindings">Bindings</button>
      <button class="tab-btn" data-tab="events">
        Events <span class="tab-badge" id="events-badge" hidden>0</span>
      </button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <!-- Bindings tab -->
    <div class="tab-content" data-panel="bindings" id="bindings-content">
      <div class="layer-stack">
        <span class="layer-stack-label">Layer Stack:</span>
        <span id="layer-stack-badges"></span>
      </div>
      <div id="layer-groups">
        <div class="empty">No bindings registered yet.</div>
      </div>
    </div>

    <!-- Events tab -->
    <div class="tab-content" data-panel="events" id="events-content" hidden>
      <div class="empty">No events captured yet. Press a shortcut in the app.</div>
    </div>

    <!-- Settings tab -->
    <div class="tab-content" data-panel="settings" hidden>
      <div class="setting-row">
        <span class="setting-label">Show notifications on fired shortcuts</span>
        <button class="toggle-btn active" id="notify-toggle">
          <span id="notify-icon">🔔</span>
          <span id="notify-label-text">On</span>
        </button>
      </div>
    </div>

    <script type="module" src="/@hk-panel-script"></script>
  </body>
</html>
